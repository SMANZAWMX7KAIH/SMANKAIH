<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SMANKAIH — 7 Kebiasaan Anak Indonesia Hebat</title>
    <meta name="description" content="Website edukasi interaktif SMANKAIH untuk memantau dan mengembangkan 7 kebiasaan positif setiap hari bagi pelajar Indonesia." />
    <meta property="og:title" content="SMANKAIH — 7 Kebiasaan Anak Indonesia Hebat" />
    <meta property="og:description" content="Langkah kecil hari ini membentuk generasi hebat di masa depan." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet" />

    <!-- Single Page Apps for GitHub Pages redirect decoder -->
    <script>
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white antialiased selection:bg-red-600 selection:text-white">
    <div id="root">
      <!-- Fallback pre-render loader: Replaced immediately when React mounts -->
      <div id="smankaih-initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #dc2626, #b91c1c); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #ffffff; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);">
          SM
        </div>
        <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px;">
          SMANKAIH
        </div>
        <div id="smankaih-loader-status" style="font-size: 12px; color: #94a3b8; max-width: 320px; line-height: 1.5; margin-bottom: 20px;">
          7 Kebiasaan Anak Indonesia Hebat &bull; Memuat aplikasi...
        </div>
        <div id="smankaih-loader-spinner" style="width: 36px; height: 36px; border: 3px solid rgba(239, 68, 68, 0.2); border-top-color: #ef4444; border-radius: 50%; animation: smankaihSpin 0.8s linear infinite;"></div>
        <style>
          @keyframes smankaihSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <noscript>
      <div style="position: fixed; inset: 0; background: #090d16; color: white; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; font-family: sans-serif;">
        <p>JavaScript diperlukan untuk menjalankan SMANKAIH. Silakan aktifkan JavaScript di peramban Anda.</p>
      </div>
    </noscript>

    <!-- Startup Watchdog: Prevents freeze, captures network/script errors, accommodates slow networks -->
    <script>
      (function() {
        var hasMounted = false;
        var safetyTimer = null;
        var progressTimer1 = null;
        var progressTimer2 = null;

        window.__SMANKAIH_MOUNTED__ = function() {
          hasMounted = true;
          if (safetyTimer) clearTimeout(safetyTimer);
          if (progressTimer1) clearTimeout(progressTimer1);
          if (progressTimer2) clearTimeout(progressTimer2);
          var loader = document.getElementById('smankaih-initial-loader');
          if (loader && loader.parentNode) {
            // Loader will be naturally replaced by React render, but ensure clean state
            loader.style.display = 'none';
          }
        };

        window.smankaihForceReload = function() {
          try {
            sessionStorage.removeItem('smankaih_session_intro');
          } catch(e) {}
          // Cache bust parameter to avoid stale cache on mobile
          var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
          window.location.href = window.location.href.split('#')[0] + sep + '_retry=' + Date.now();
        };

        function showStartupFailure(msg) {
          if (hasMounted) return;
          var loader = document.getElementById('smankaih-initial-loader');
          if (loader) {
            loader.style.display = 'flex';
            loader.innerHTML = [
              '<div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(220, 38, 38, 0.2); border: 2px solid #ef4444; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 16px; color: #ef4444;">⚠</div>',
              '<div style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; color: #ffffff;">Kendala Memuat SMANKAIH</div>',
              '<div style="font-size: 12px; color: #cbd5e1; max-width: 320px; line-height: 1.5; margin-bottom: 16px;">' + (msg || 'Waktu pemuatan melebihi batas atau koneksi internet tidak stabil.') + '</div>',
              '<button onclick="window.smankaihForceReload()" style="background: linear-gradient(135deg, #dc2626, #b91c1c); color: #ffffff; border: none; padding: 10px 22px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4); margin-bottom: 10px;">Coba Lagi (Muat Ulang)</button>',
              '<div style="font-size: 11px; color: #64748b; margin-top: 6px;">Tips: Pastikan koneksi internet HP aktif dan peramban telah diperbarui.</div>'
            ].join('');
          }
        }

        // Capture phase error listener to detect script/stylesheet load failures (e.g. 404 or raw tsx)
        window.addEventListener('error', function(e) {
          if (hasMounted) return;
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var url = target.src || target.href || 'modul';
            var file = url.split('/').pop().split('?')[0] || 'modul';

            // Detect if browser was erroneously asked to load unbundled TypeScript source
            if (file === 'main.tsx' || file.slice(-4) === '.tsx') {
              var p = window.location.pathname;
              if (p.indexOf('/dist') === -1 && window.location.protocol.indexOf('http') === 0) {
                var targetPath = p.endsWith('/') ? p + 'dist/' : p + '/dist/';
                window.location.replace(targetPath + window.location.search + window.location.hash);
                return;
              }
              showStartupFailure('Berkas aplikasi mentah (' + file + ') tidak dapat dieksekusi peramban secara langsung. Pastikan GitHub Actions telah mengompilasi proyek ke folder "dist".');
              return;
            }

            showStartupFailure('Gagal mengunduh berkas aplikasi (' + file + '). Periksa koneksi internet Anda.');
          }
        }, true);

        // Slow connection reassurance milestones (does not fail prematurely)
        progressTimer1 = setTimeout(function() {
          if (!hasMounted) {
            var statusEl = document.getElementById('smankaih-loader-status');
            if (statusEl) {
              statusEl.innerText = 'Mengunduh modul SMANKAIH... Mohon tunggu sebentar.';
            }
          }
        }, 3500);

        progressTimer2 = setTimeout(function() {
          if (!hasMounted) {
            var statusEl = document.getElementById('smankaih-loader-status');
            if (statusEl) {
              statusEl.innerText = 'Menyiapkan tampilan untuk HP Android... Sedang memproses.';
            }
          }
        }, 8000);

        // Safe 18-second timeout for truly disconnected or stalled connections
        safetyTimer = setTimeout(function() {
          if (!hasMounted && document.getElementById('smankaih-initial-loader')) {
            showStartupFailure('Aplikasi memerlukan waktu lebih lama dari biasanya untuk dimuat. Silakan periksa jaringan internet Anda.');
          }
        }, 18000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
